# Runs the tests on every push to main and every pull request, and on main
# publishes the website once they pass.
#
# The tests: the unit tests in Node, then the browser tests in headless
# Chromium, which Playwright downloads here (CHROME_PATH stays unset), under c8.
# Their line coverage of src/ goes to the website as coverage.json, which the
# README's coverage badge reads through shields.io.
#
# The mutation tests: Stryker mutates src/core.js and runs the unit tests
# against each mutant; the run fails below the score in stryker.config.json.
# The browser half isn't mutated, since every mutant would cost a browser run.
# The score goes to the website as mutation.json, for the README's badge.
#
# The website: GitHub Pages, served at https://cssv.dev (the custom domain is
# set in the repository's Pages settings). site/ becomes the root; its pages
# load ../src/ and ../examples/, which resolve to /src/ and /examples/ there,
# so they work unchanged.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run coverage
      - name: Coverage badge
        run: |
          node -e '
            const { pct } = require("./coverage/coverage-summary.json").total.lines;
            const color = pct >= 90 ? "brightgreen" : pct >= 75 ? "yellow" : "red";
            console.log(JSON.stringify({ schemaVersion: 1, label: "coverage", message: `${pct}%`, color }));
          ' > coverage.json
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.json

  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run mutate
      # Also when the score is below the break threshold: the badge shows it.
      - name: Mutation badge
        if: ${{ !cancelled() }}
        run: |
          node -e '
            const { files } = require("./reports/mutation/mutation.json");
            const { thresholds } = require("./stryker.config.json");
            const count = (...s) => Object.values(files).flatMap((f) => f.mutants).filter((m) => s.includes(m.status)).length;
            const detected = count("Killed", "Timeout");
            const score = (100 * detected) / (detected + count("Survived", "NoCoverage"));
            const color = score >= thresholds.high ? "brightgreen" : score >= thresholds.low ? "yellow" : "red";
            console.log(JSON.stringify({ schemaVersion: 1, label: "mutation score", message: `${score.toFixed(2)}%`, color }));
          ' > mutation.json
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: mutation
          path: mutation.json
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: reports/mutation/mutation.html

  deploy:
    # Waits for the mutation tests to publish their score, but doesn't need
    # them to pass: a lower score shows on the badge.
    needs: [test, mutation]
    if: ${{ !cancelled() && needs.test.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble the site
        run: |
          mkdir _site
          cp -r src examples skills SPEC.md CONFORMANCE.md README.md llms.txt _site/
          cp -r site/. _site/
          # The examples pages reach the website as ../site/; here it is the root.
          sed -i 's#\.\./site/#../#g' _site/examples/index.html _site/examples/experiments.html
      - uses: actions/download-artifact@v8
        with:
          name: coverage
          path: _site
      - uses: actions/download-artifact@v8
        continue-on-error: true # missing when the mutation job failed before its score
        with:
          name: mutation
          path: _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5

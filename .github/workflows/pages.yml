# Publishes the website to GitHub Pages, served at https://cssv.dev (the
# custom domain is set in the repository's Pages settings). site/ becomes the
# root; its pages load ../src/ and ../examples/, which resolve to /src/ and
# /examples/ there, so they work unchanged.
name: Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble the site
        run: |
          mkdir _site
          cp -r src examples skills SPEC.md CONFORMANCE.md README.md llms.txt _site/
          cp -r site/. _site/
          # The examples page reaches the website as ../site/; here it is the root.
          sed -i 's#\.\./site/#../#g' _site/examples/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
